# cf-workers-status-page v2 — wrangler v4 config
# NOTE: the real KV namespace id is injected by .github/workflows/deploy.yml
# on every deploy (it creates the namespace if missing). For local dev,
# `wrangler dev --local` uses local storage and ignores the placeholder.

name = "nextdns"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

# Checks are triggered externally (GitHub Actions -> POST /api/check every 5 min)
# so they run from the placed colo (Singapore). The built-in Workers cron is
# intentionally disabled: placement does not affect the scheduled handler,
# and it would run from a random global colo with high latency to VN/SEA.
[placement]
region = "aws:ap-southeast-1"

[[kv_namespaces]]
binding = "KV_STATUS_PAGE"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[assets]
directory = "public"
