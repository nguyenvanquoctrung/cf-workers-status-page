name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

      - name: Ensure KV namespace exists
        # Uses the Cloudflare REST API directly: `wrangler kv namespace`
        # subcommands no longer accept --output json in v4.
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          NS_ID=$(curl -s -H "$AUTH" "$API?per_page=100" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              try {
                const j=JSON.parse(d||'{}');
                if(j.success===false){ console.error('KV list error: '+JSON.stringify(j.errors)); }
                const f=(j.result||[]).find(n=>(n.title||'').includes('KV_STATUS_PAGE'));
                console.log(f?f.id:'');
              } catch(e){ console.log(''); }
            })")
          if [ -z "$NS_ID" ]; then
            echo "Creating KV namespace nextdns-KV_STATUS_PAGE ..."
            NS_ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"title":"nextdns-KV_STATUS_PAGE"}' "$API" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
                try {
                  const j=JSON.parse(d||'{}');
                  if(j.success===false){ console.error('KV create error: '+JSON.stringify(j.errors)); }
                  console.log((j.result&&j.result.id)||'');
                } catch(e){ console.log(''); }
              })")
          fi
          if [ -z "$NS_ID" ]; then echo "Failed to resolve KV namespace id"; exit 1; fi
          echo "KV namespace id: $NS_ID"
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/$NS_ID/" wrangler.toml
          grep -q "KV_NAMESPACE_ID_PLACEHOLDER" wrangler.toml && { echo "placeholder not replaced"; exit 1; } || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          put_secret() {
            local name="$1" value="$2"
            [ -z "$value" ] && value="default-gh-action-secret"
            printf '%s' "$value" | npx wrangler secret put "$name"
          }
          put_secret SECRET_SLACK_WEBHOOK_URL "${{ secrets.SECRET_SLACK_WEBHOOK_URL }}"
          put_secret SECRET_TELEGRAM_API_TOKEN "${{ secrets.SECRET_TELEGRAM_API_TOKEN }}"
          put_secret SECRET_TELEGRAM_CHAT_ID "${{ secrets.SECRET_TELEGRAM_CHAT_ID }}"
          put_secret SECRET_DISCORD_WEBHOOK_URL "${{ secrets.SECRET_DISCORD_WEBHOOK_URL }}"
          put_secret CHECK_SECRET "${{ secrets.CHECK_SECRET }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Clear cron triggers (checks run via GitHub Actions from SIN)
        # Belt & suspenders: wrangler only deletes cron triggers when
        # `crons = []` is explicit in wrangler.toml; this API call guarantees
        # no stray trigger survives a deploy.
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nextdns/schedules"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo "Schedules before: $(curl -s -H "$AUTH" "$API")"
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" --data '[]' "$API" | head -c 400
          echo ""
          echo "Schedules after: $(curl -s -H "$AUTH" "$API")"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
