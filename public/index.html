<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status Page</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply theme before first paint (avoids flash). 'auto' (default) follows the OS.
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('theme'); } catch (e) {}
      var eff = (mode === 'light' || mode === 'dark') ? mode :
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = eff;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span id="logoWrap" class="logo-wrap"></span>
        <span id="pageTitle" class="site-title">Status Page</span>
      </div>
      <div class="header-actions">
        <nav class="nav" aria-label="Views">
          <a data-view="status" class="active">Status</a><a data-view="incidents">Incidents</a><a data-view="ping">Ping</a><a data-view="speedtest">Speedtest</a><a data-view="dns" data-i18n-key="nav.dns">DNS Tools</a><a data-view="setup" data-i18n-key="nav.setup">Setup</a>
        </nav>
        <div class="filter-wrap">
          <input id="filterInput" type="text" placeholder="Tap '/' to search" autocomplete="off" />
          <span class="filter-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M9 9a2 2 0 114 0 2 2 0 01-4 0z"/><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a4 4 0 00-3.446 6.032l-2.261 2.26a1 1 0 101.414 1.415l2.261-2.261A4 4 0 1011 5z" clip-rule="evenodd"/></svg>
          </span>
        </div>
        <button id="themeBtn" class="icon-btn" title="Theme: Auto — click to change" aria-label="Theme: Auto — click to change"></button>
        <button id="langBtn" class="icon-btn lang-btn" title="Ngôn ngữ / Language" aria-label="Chuyển ngôn ngữ / Switch language">EN</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="statusView">
      <div id="statusHeader"></div>

      <div class="monitors-card">
        <div id="monitors"></div>
      </div>
    </div>

    <div id="pingView" hidden>
      <div class="monitors-card">
        <div id="worldPing"></div>
      </div>
    </div>

    <div id="incidentsView" hidden>
      <div class="monitors-card">
        <div id="incidents"></div>
      </div>
    </div>

    <div id="speedtestView" hidden>
      <div class="monitors-card">
        <div id="speedtest"></div>
      </div>
    </div>

    <div id="dnsView" hidden>
      <div class="monitors-card">
        <div id="dnsTools"></div>
      </div>
    </div>
    <div id="setupView" hidden>
      <div class="monitors-card">
        <div id="setupTools"></div>
      </div>
    </div>

    <footer class="footer">
      <div>Powered by <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a>, made with ❤ by <a href="https://github.com/nguyenvanquoctrung" target="_blank" rel="noopener">nguyenvanquoctrung</a> · <a href="https://github.com/nguyenvanquoctrung/cf-workers-status-page" target="_blank" rel="noopener">Get Your Status Page</a></div>
    </footer>
  </main>
  <div id="incidentModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><span id="incidentModalTitle"></span><button id="incidentModalClose" class="modal-x" aria-label="Close">&times;</button></div>
      <div id="incidentModalBody" class="modal-body"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
