# Scheduled maintenances, shown on the Incidents view (UptimeFlare-style).
# Each entry:
#   title    - shown on the card (default: "Scheduled Maintenance")
#   body     - description text (optional)
#   monitors - list of monitor ids (optional; omit = all monitors)
#   start    - ISO 8601 start time (required)
#   end      - ISO 8601 end time (optional; omit = ongoing)
#   color    - accent color (optional, default #FAB005)
# During an active window, affected monitors show a yellow triangle icon.
