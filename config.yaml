settings:
  title: 'Status Page'
  url: 'https://nextdns.jeremienguyen.workers.dev' # used for Slack messages
  logo: logo-192x192.png # image in ./public/ folder
  daysInHistogram: 30 # number of days you want to display in the chart
  collectResponseTimes: true # collects avg response times from CRON locations

  allmonitorsOperational: 'All Systems Operational'
  notAllmonitorsOperational: 'Not All Systems Operational'
  monitorLabelOperational: 'Operational'
  monitorLabelNotOperational: 'Not Operational'
  monitorLabelNoData: 'No data'
  dayInHistogramNoData: 'No data'
  dayInHistogramOperational: 'All good'
  dayInHistogramNotOperational: ' incident(s)' # xx incident(s) recorded

# NextDNS edge PoPs, ordered by latency measured from Vietnam (2026-10-14).
# URL pattern: https://<id>-1.edge.nextdns.io/resolve?name=google.com
monitors:
  - id: lightnode-sgn
    name: Hồ Chí Minh LightNode
    description: 'lightnode-sgn-1.edge.nextdns.io'
    url: 'https://lightnode-sgn-1.edge.nextdns.io/resolve?name=google.com'
    method: GET
    expectStatus: 200
    followRedirect: false
    linkable: false

  - id: viettel-sgn
